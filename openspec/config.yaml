schema: spec-driven

context: |
  Tech stack: Next.js 15.x (App Router), React 19, TypeScript 5 (strict), pnpm
  Database: PostgreSQL 15 via Docker, Prisma 5.18.0 ORM
  Auth: Next-Auth 5 (Credentials provider, middleware-protected routes)
  Styling: Tailwind CSS 3.4, shadcn/ui (Radix UI), class-variance-authority
  Forms/validation: React Hook Form + Zod
  State: Zustand (exercise, workout, UI stores)
  Architecture: feature-grouped server actions, App Router with RSC, Prisma data layer
  Linting: ESLint (next/core-web-vitals), Prettier formatter (see .prettierrc)

rules:
  proposal:
    - Create proposal.md for every change; keep it brief
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Create design.md only for a meaningful technical decision or risk
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows
  tasks:
    - The detailed checklist lives in odd/tasks/<feature>.md (versioned in Git, mirrored in Engram)
    - tasks.md is a brief index that points to that checklist; do not duplicate checkboxes here
    - Group checklist items by phase, use stable task identifiers, and size work units for one session when practical
  apply:
    guidelines:
      - Follow existing feature-based server actions pattern
      - Keep Prisma queries in lib/ or data/ layer, not in components
      - Use Zod schemas for all server action inputs
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Archive the detailed ODD task doc with the dated change folder
    - Sync behavior deltas to openspec/specs/
    - Update the Notion task status and archive reference

testing:
  strict_tdd: true
  reason: "Vitest runner configured; Stage 1 covers pure-logic units only (stores, schemas, lib utils)"
  detected: "2026-08-24"
  runner:
    available: true
    framework: vitest
    command: "pnpm test"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      tool: "ESLint"
      command: "pnpm lint"
    type_checker:
      available: true
      tool: "TypeScript"
      command: "pnpm exec tsc --noEmit"
    formatter:
      available: true
      tool: "Prettier"
      command: "pnpm run format:check"
  verified: "2026-09-09"
  projects:
    - path: "."
      stack: "Next.js 15 (App Router, RSC), React 19, TypeScript 5 (strict), Prisma 5.18, PostgreSQL 15, Next-Auth 5, Tailwind/shadcn, Zustand, Zod"
      test_command: "pnpm test"
      framework: "vitest"
      layers:
        unit: true
        integration: false
        e2e: false
      coverage:
        available: false
        command: ""
      quality:
        linter: "pnpm lint"
        type_checker: "pnpm exec tsc --noEmit"
        formatter: "pnpm run format:check"
        build: "pnpm build"
        schema: "pnpm exec prisma validate"
